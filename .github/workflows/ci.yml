name: CI

# Runs on every pull request and on pushes to the long-lived branches.
on:
  pull_request:
  push:
    branches: [main, dev, v-1.0]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks: types, lint and the unit tests. None of these need a database.
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Prisma client is generated, not committed.
      - run: npx prisma generate
      - run: npm run lint
      # Next generates global types (LayoutProps and friends) that the app uses; they aren't committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  # The end-to-end suite (Playwright): a production build, a real Postgres, a fake mail server.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geodex
          POSTGRES_PASSWORD: geodex_dev_password
          POSTGRES_DB: geodex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geodex -d geodex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://geodex:geodex_dev_password@localhost:5432/geodex_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install browsers (Chromium and WebKit, with their system libraries)
        run: npx playwright install --with-deps chromium webkit
      - name: Run the end-to-end suite
        run: npm run test:e2e
      - name: Keep the report and any failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
