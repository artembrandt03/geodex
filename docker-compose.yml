services:
  postgres:
    image: postgres:16-alpine
    container_name: geodex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geodex
      POSTGRES_PASSWORD: geodex_dev_password
      POSTGRES_DB: geodex
    ports:
      - "5442:5432" # host 5442 avoids clashing with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
